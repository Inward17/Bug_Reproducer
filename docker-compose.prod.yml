services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: autorepro-api:latest
    container_name: autorepro_api
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # allows spawning sandbox containers
      - ./data:/app/data                             # persists job JSONs + screenshots
    environment:
      # Sandbox containers are created by the HOST daemon, so bind sources must be host
      # paths. Without this the daemon creates empty directories and no screenshot ever
      # comes back. setup.sh writes it to .env; ${PWD} isn't used because `sudo` clears it.
      - HOST_DATA_DIR=${HOST_DATA_DIR:?set HOST_DATA_DIR in .env to the absolute path of ./data}
    extra_hosts:
      # Lets the API reach a service on the host, the same way the sandbox does.
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.production
    restart: always
    healthcheck:
      # /health pings the Docker daemon, so an unusable socket shows up as unhealthy.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # The sandbox image is NOT a long-running service.
  # It is built here so `docker compose build` builds both images in one step.
  # The API spawns fresh containers from autorepro-sandbox:latest per job.
  sandbox:
    build:
      context: ./autorepro/sandbox
      dockerfile: Dockerfile
    image: autorepro-sandbox:latest
    profiles:
      - build-only   # never starts as a service; just ensures the image is built
