name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autorepro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: autorepro/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          LLM_PROVIDER: mock
        run: python -m pytest tests/ -q

      - name: Re-check the findings in docs/analysis
        env:
          LLM_PROVIDER: mock
        run: |
          python ../docs/analysis/verify_bugs.py | tee /tmp/findings.txt
          grep -q "^0/" /tmp/findings.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.14.2

      - name: Lint
        run: ruff check autorepro

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -t autorepro-api:ci .

      - name: Build the sandbox image
        run: docker build -t autorepro-sandbox:ci ./autorepro/sandbox

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check setup.sh
        run: shellcheck setup.sh autorepro/flamegraph.sh
